<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shiniji BOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm kitchen tool, menu-book warmth, no fuss
   IDEA: the Shiniji menu book itself — paper, gold rules, dish photos
   PICTURE: real dish photos from the book on every menu and recipe
   COLOUR and TYPE: paper ground, Shiniji gold #90732C, red #D42027 for warnings; Prompt + Sarabun
   LAYOUT: top bar, one working view at a time, recipe = photo/cost header then lines */
:root{color-scheme:light dark;--bg:light-dark(#f1ece1,#17150f);--card:light-dark(#fbf8f1,#221f17);--ink:light-dark(#1d1a14,#f0e9d8);--mute:light-dark(#6f675a,#a89f8c);--line:light-dark(#ddd3bf,#3a3528);--gold:light-dark(#90732C,#c9a656);--goldbg:light-dark(#efe3c4,#3a301a);--red:#D42027;--redbg:light-dark(#fbe3e2,#3b1716);--ok:light-dark(#2f7a45,#6cc28a);--okbg:light-dark(#dcefe0,#1b3324);--amb:light-dark(#9a6a00,#e2b34c);--ambbg:light-dark(#f7ebc9,#3a2f12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,"Noto Sans Thai",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.pf{font-family:Prompt,Sarabun,sans-serif;font-weight:600;line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px);background:var(--card);border-bottom:1px solid var(--line)}
.brand{font:700 20px Prompt;letter-spacing:.04em;color:var(--gold);background:none;border:0;padding:0}
.brand b{color:var(--red)}
.crumb{color:var(--mute);font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,14px) 80px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(32px,4.5vw,48px);text-wrap:balance}
.hero p{color:var(--mute);margin:10px 0 0}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{font:700 clamp(34px,5vw,52px) Prompt;color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:left;min-height:150px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.act:hover{border-color:var(--gold);transform:translateY(-2px)}
.act .ic{width:44px;height:44px;border-radius:12px;background:var(--goldbg);color:var(--gold);display:grid;place-items:center;font:700 24px Prompt;margin-bottom:8px}
.act b{font:600 20px Prompt}.act span{color:var(--mute);font-size:15px}
.sec{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.sec h2{font-size:clamp(26px,3vw,34px)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px}
.cat:hover{border-color:var(--gold)}
.cat b{font:600 18px Prompt}.cat small{color:var(--mute);font-size:13px}
.cat.off{opacity:.55}
.cat.sub{border-style:dashed}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;min-height:36px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.chip.add{border-style:dashed}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mi{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.mi:hover{border-color:var(--gold)}
.mi img,.ph{width:92px;height:70px;object-fit:cover;border-radius:9px;background:var(--line);display:grid;place-items:center;color:var(--mute);font-size:24px}
.mi b{display:block;font:600 16px Prompt;line-height:1.2}
.mi small{color:var(--mute);font-size:13px;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pr{font-weight:600;white-space:nowrap}
.st{font-size:12.5px;border-radius:99px;padding:1px 9px;white-space:nowrap}
.st.done{background:var(--okbg);color:var(--ok)}.st.review{background:var(--ambbg);color:var(--amb)}.st.none{background:var(--line);color:var(--mute)}.st.over{background:var(--redbg);color:var(--red)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.head img,.head .ph{width:200px;height:150px;border-radius:12px;object-fit:cover}
.head h2{font-size:clamp(24px,3vw,32px)}
.head .th{color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kpi small{color:var(--mute);font-size:13px;display:block}
.kpi b{font:700 22px Prompt;white-space:nowrap}
.fcbar{height:8px;border-radius:99px;background:var(--line);margin-top:6px;position:relative}
.fcbar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.fcbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:70%}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.box h3{font-size:17px;margin-bottom:10px}
.say{display:flex;gap:8px}
.say input,.srch,.fld input,.fld select{flex:1;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px;font-size:16px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#fff;padding:0 18px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.red{background:var(--red);border-color:var(--red)}
.hint{color:var(--mute);font-size:13px;margin-top:6px}
.prev{margin-top:10px;border:1px dashed var(--gold);border-radius:12px;padding:10px}
.prev .r{display:grid;grid-template-columns:22px minmax(0,1fr) 90px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.prev select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:500 13px Sarabun;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input{width:84px;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;text-align:right;font-size:16px}
.iname small{display:block;color:var(--mute);font-size:12.5px}
.warn{color:var(--red);font-size:12.5px}
.del{border:0;background:none;color:var(--mute);font-size:20px;width:40px;height:40px;border-radius:8px}
.del:hover{background:var(--redbg);color:var(--red)}
.res{max-height:300px;overflow:auto;margin-top:8px}
.res button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 6px;font-size:14.5px}
.res button:hover,.res button.k{background:var(--goldbg)}
.res small{color:var(--mute)}
.foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.fld{display:grid;gap:4px;margin-bottom:12px}.fld label{font-size:14px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.dash{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.drow{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.drow .bar{height:12px}
.scroll{overflow-x:auto}
@media(max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}.acts{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.dash{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.head{grid-template-columns:minmax(0,1fr)}.head img,.head .ph{width:100%;height:180px}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi b{font-size:18px}td input{width:64px}.hide-s{display:none}.drow{grid-template-columns:100px minmax(0,1fr) 54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><button class="brand" id="home">SHI<b>N</b>IJI <span style="color:var(--ink);font-weight:500">BOM</span></button><div class="crumb" id="crumb"></div><span class="tag">ร่าง · รอเชฟรับรอง · ดูอย่างเดียว</span></div>
<main id="app"><p>กำลังโหลดข้อมูล…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
{
const sb=supabase.createClient('https://ewfjxxhpgquyfssillru.supabase.co','sb_publishable_NqeiBwgml9GaZSnJn8Iykw_dBWH8oTo');
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={done:['done','ครบ'],review:['review','รอเชฟยืนยัน'],fix:['over','ต้องแก้']};
const SST={done:['done','มีสูตรแล้ว'],review:['review','รอเชฟยืนยัน'],fix:['over','ยังไม่มีสูตร']};
const COL={done:'var(--ok)',review:'var(--amb)',fix:'var(--red)'};
let M=[],L={},S=[],SL={},IT=[],CATS=[],view={v:'home'},flt='all',q='';
async function get(t,ord){let out=[],from=0;for(;;){let qq=sb.from(t).select('*');ord.split(',').forEach(o=>qq=qq.order(o));const {data,error}=await qq.range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
const num=x=>x==null?'':(Math.round(x*100)/100).toLocaleString('th-TH');
const baht=x=>x==null?'—':'฿'+(Math.round(x*100)/100).toLocaleString('th-TH');
function crumb(parts){$('#crumb').innerHTML=parts.map((p,i)=>p.go?`<a data-go='${esc(JSON.stringify(p.go))}'>${esc(p.t)}</a>`:esc(p.t)).join(' › ')}
function go(v){view=v;if(v.v!=='list'&&v.v!=='subs'&&v.v!=='items'){flt='all';q=''}render();scrollTo(0,0)}
function bar(c){const n=c.done+c.review+c.fix||1;return `<div class="bar">${['done','review','fix'].map(k=>`<i style="width:${c[k]/n*100}%;background:${COL[k]}"></i>`).join('')}</div>`}
function cnt(ms){return{done:ms.filter(m=>m.status==='done').length,review:ms.filter(m=>m.status==='review').length,fix:ms.filter(m=>m.status==='fix').length,n:ms.length}}
const legend=`<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>ครบ</span><span><i class="dot" style="background:var(--amb)"></i>รอเชฟยืนยัน</span><span><i class="dot" style="background:var(--red)"></i>ต้องแก้</span></div>`;
function home(){crumb([{t:'หน้าแรก'}]);const c=cnt(M),sc=cnt(S);
app.innerHTML=`<div class="hero"><div><h1>BOM ครัว Shiniji</h1><p>ฐาน: ไฟล์ MMaster_Shiniji ของที่ปรึกษา (ms.itemnew · recipe (F) · bom.base (F)) อัปเดตราคาใบรับล่าสุด แก้หน่วย/yield และสูตรตามชีตสูตรร้าน · เป็นร่างจนกว่าเชฟจะเซ็นรับรองครบ · ยังไม่รวมบาร์/คาเฟ่</p></div>
<div class="prog"><small style="color:var(--mute)">เมนูครัวทั้งหมด</small><div class="big">${c.n} <span style="font-size:18px;color:var(--mute)">เมนู</span></div>${bar(c)}<div class="legend"><span><i class="dot" style="background:var(--ok)"></i>ครบ ${c.done}</span><span><i class="dot" style="background:var(--amb)"></i>รอเชฟยืนยัน ${c.review}</span><span><i class="dot" style="background:var(--red)"></i>ต้องแก้ ${c.fix}</span></div></div></div>
<div class="acts">
<button class="act" data-go='{"v":"cats"}'><div class="ic">◫</div><b>BOM รายเมนู</b><span>เลือกหมวดตามเล่มเมนู แล้วดูวัตถุดิบ ปริมาณ</span></button>
<button class="act" data-go='{"v":"subs"}'><div class="ic">◍</div><b>สูตรย่อย / ซอส</b><span>มีสูตรแล้ว ${sc.done} · ยังไม่มี ${sc.fix}</span></button>
<button class="act" data-go='{"v":"dash"}'><div class="ic">▤</div><b>ภาพรวมสถานะ</b><span>ครบ / รอเชฟ / ต้องแก้ รายหมวด</span></button>
<button class="act" data-go='{"v":"items"}'><div class="ic">▦</div><b>คลังวัตถุดิบ</b><span>${IT.length} รหัส · ราคาไฟล์ที่ปรึกษา vs ใบรับล่าสุด</span></button></div>`}
function cats(){crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'BOM รายเมนู'}]);
app.innerHTML=`<div class="sec"><h2>เลือกหมวด</h2>${legend}</div><div class="cats">${CATS.map(k=>{const c=cnt(M.filter(m=>m.cat===k));return `<button class="cat" data-go='${esc(JSON.stringify({v:'list',cat:k}))}'><b>${esc(k)}</b><small>${c.n} เมนู · ครบ ${c.done} · รอเชฟ ${c.review} · ต้องแก้ ${c.fix}</small>${bar(c)}</button>`}).join('')}</div>`}
function chips(){return `<div class="filters">${[['all','ทั้งหมด'],['done','ครบ'],['review','รอเชฟยืนยัน'],['fix','ต้องแก้']].map(([k,t])=>`<button class="chip ${flt===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>`}
function list(cat){crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'BOM รายเมนู',go:{v:'cats'}},{t:cat}]);
const ms=M.filter(m=>m.cat===cat&&(flt==='all'||m.status===flt));
app.innerHTML=`<div class="sec"><h2>${esc(cat)}</h2>${chips()}</div><div class="list">${ms.map(m=>`<button class="mi" data-go='${esc(JSON.stringify({v:'menu',id:m.id}))}'>${m.img?`<img src="${m.img}" alt="">`:'<div class="ph">🍣</div>'}<div><b>${esc(m.name)}</b>${m.th?`<small>${esc(m.th)}</small>`:''}<div class="row"><span class="st ${ST[m.status][0]}">${ST[m.status][1]}</span><small>ครัว${esc(m.station)} · ${(L[m.id]||[]).length} บรรทัด</small></div></div></button>`).join('')||'<p class="hint">ไม่มีเมนูในสถานะนี้</p>'}</div>`}
function ltable(ls){return `<div class="scroll"><table><thead><tr><th>#</th><th>วัตถุดิบ</th><th style="text-align:right">ปริมาณ</th><th>หน่วย</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${l.seq}</td><td class="iname">${l.sub?`<a style="color:var(--gold);cursor:pointer;text-decoration:underline" data-go='${esc(JSON.stringify({v:'sub',id:l.sub}))}'>${esc(l.ingredient)}</a>`:esc(l.ingredient)}</td><td class="n">${l.qty!=null?num(l.qty):`<span class="warn">${esc(l.qty_text||'ว่าง')}</span>`}</td><td>${esc(l.unit||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="warn">ยังไม่มีบรรทัดวัตถุดิบ</td></tr>'}</tbody></table></div>`}
function issues(t){return t?`<div class="box" style="border-color:var(--red)"><h3>ที่ยังต้องแก้ / รอเชฟ</h3><div style="white-space:pre-line;font-size:15px">${esc(t)}</div></div>`:''}
function menu(id){const m=M.find(x=>x.id===id);crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'BOM รายเมนู',go:{v:'cats'}},{t:m.cat,go:{v:'list',cat:m.cat}},{t:m.name}]);
app.innerHTML=`<div class="head">${m.img?`<img src="${m.img}" alt="">`:'<div class="ph">🍣</div>'}<div><h2>${esc(m.name)}</h2>${m.th?`<div class="th">${esc(m.th)}</div>`:''}<div class="row" style="margin-top:10px"><span class="st ${ST[m.status][0]}">${ST[m.status][1]}</span><span class="tag">${esc(m.cat)}</span><span class="tag">ครัว${esc(m.station)}</span></div><p class="hint">ที่มาสูตร: ${esc(m.src||'—')}</p></div></div>${issues(m.issues)}<div class="box"><h3>วัตถุดิบต่อ 1 จาน</h3>${ltable(L[m.id]||[])}${m.note?`<p class="hint">หมายเหตุ: ${esc(m.note)}</p>`:''}</div>`}
function subs(){crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'สูตรย่อย / ซอส'}]);
const ss=S.filter(s=>flt==='all'||s.status===flt);
app.innerHTML=`<div class="sec"><h2>สูตรย่อย / ซอส</h2><div class="filters">${[['all','ทั้งหมด'],['done','มีสูตรแล้ว'],['fix','ยังไม่มีสูตร']].map(([k,t])=>`<button class="chip ${flt===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div></div><div class="list">${ss.map(s=>`<button class="mi" style="grid-template-columns:minmax(0,1fr)" data-go='${esc(JSON.stringify({v:'sub',id:s.id}))}'><div><b>${esc(s.name)}</b><div class="row"><span class="st ${SST[s.status][0]}">${SST[s.status][1]}</span><small>${(SL[s.id]||[]).length} บรรทัด · ${esc(s.src||'')}</small></div></div></button>`).join('')}</div>`}
function sub(id){const s=S.find(x=>x.id===id);crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'สูตรย่อย / ซอส',go:{v:'subs'}},{t:s.name}]);
app.innerHTML=`<div class="box"><h2>${esc(s.name)}</h2><div class="row" style="margin:8px 0"><span class="st ${SST[s.status][0]}">${SST[s.status][1]}</span></div><p class="hint">ที่มา: ${esc(s.src||'—')}${s.note?' · '+esc(s.note):''}</p></div>${issues(s.issues)}<div class="box"><h3>วัตถุดิบต่อ 1 สูตร</h3>${ltable(SL[s.id]||[])}</div>`}
function dash(){crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'ภาพรวมสถานะ'}]);const c=cnt(M);
app.innerHTML=`<div class="sec"><h2>ภาพรวมสถานะ BOM</h2>${legend}</div><div class="dash"><div class="box">${CATS.map(k=>{const x=cnt(M.filter(m=>m.cat===k));return `<div class="drow"><span>${esc(k)}</span>${bar(x)}<span style="text-align:right">${x.done}/${x.n}</span></div>`}).join('')}</div>
<div class="box"><h3>สรุป</h3><table><tr><td>เมนูทั้งหมด</td><td class="n">${c.n}</td></tr><tr><td>ครบ</td><td class="n">${c.done}</td></tr><tr><td>รอเชฟยืนยัน</td><td class="n">${c.review}</td></tr><tr><td>ต้องแก้</td><td class="n">${c.fix}</td></tr><tr><td>สูตรย่อยมีแล้ว / ทั้งหมด</td><td class="n">${S.filter(s=>s.status==='done').length} / ${S.length}</td></tr></table><p class="hint">ขั้นต่อไป: เชฟตรวจเล่มสูตรและเซ็นรับรอง → อัปเดตในระบบ → ทำชุดนำเข้าคอลัมน์ตรงกับไฟล์ที่ปรึกษา</p></div></div>`}
function items(){crumb([{t:'หน้าแรก',go:{v:'home'}},{t:'คลังวัตถุดิบ'}]);
const n=s=>String(s||'').toLowerCase();const qq=n(q);
let r=IT.filter(i=>!qq||n(i.name).includes(qq)||i.code.includes(qq));
if(flt==='diff')r=r.filter(i=>i.unit_ok&&i.c_price&&i.gr_price&&Math.abs(i.gr_price/i.c_price-1)>.15&&i.gr_price/i.c_price<=2&&i.gr_price/i.c_price>=.5);
if(flt==='unit')r=r.filter(i=>i.gr_price&&i.c_price&&(i.unit_ok===false||i.gr_price/i.c_price>2||i.gr_price/i.c_price<.5));
app.innerHTML=`<div class="sec"><h2>คลังวัตถุดิบ</h2><div class="filters">${[['all','ทั้งหมด'],['diff','ราคาต่างเกิน 15%'],['unit','หน่วยไม่ตรง / ต่างเกิน 2 เท่า']].map(([k,t])=>`<button class="chip ${flt===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div></div>
<input class="srch" id="q" placeholder="ค้นชื่อหรือรหัส…" value="${esc(q)}" style="width:100%;margin-bottom:12px"><p class="hint">${r.length} รหัส · ราคาก่อน VAT ต่อหน่วยสต็อก · ราคาใบรับ = ใบล่าสุดถึง 23 พ.ย. 2026</p>
<div class="box scroll"><table><thead><tr><th>รหัส</th><th>วัตถุดิบ</th><th>หน่วย</th><th style="text-align:right">ไฟล์ที่ปรึกษา</th><th style="text-align:right">ใบรับล่าสุด</th><th style="text-align:right">ต่าง</th><th class="hide-s">วันที่ / ผู้ขาย</th></tr></thead><tbody>${r.slice(0,400).map(i=>{const d=i.c_price&&i.gr_price?i.gr_price/i.c_price-1:null;const bad=i.gr_price&&(i.unit_ok===false||(d!=null&&(d>1||d<-.5)));return `<tr><td>${i.code}</td><td class="iname">${esc(i.name)}</td><td>${esc(i.unit||'')}</td><td class="n">${baht(i.c_price)}</td><td class="n">${baht(i.gr_price)}${i.unit_ok===false?`<small class="warn"> /${esc(i.gr_unit)}</small>`:''}</td><td class="n" style="color:${bad?'var(--red)':d>.15?'var(--red)':d<-.15?'var(--ok)':'inherit'}">${bad?'หน่วย?':d==null?'':(d>0?'+':'')+Math.round(d*100)+'%'}</td><td class="hide-s"><small>${esc(i.gr_date||'')} ${esc(i.gr_vendor||'')}</small></td></tr>`}).join('')}</tbody></table>${r.length>400?'<p class="hint">แสดง 400 รายการแรก พิมพ์ค้นเพื่อกรอง</p>':''}</div>`;
const inp=$('#q');inp.oninput=e=>{q=e.target.value;const p=inp.selectionStart;items();const i2=$('#q');i2.focus();i2.setSelectionRange(p,p)}}
function render(){({home,cats,list:()=>list(view.cat),menu:()=>menu(view.id),subs,sub:()=>sub(view.id),dash,items})[view.v]()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(JSON.parse(g.dataset.go));return}const f=e.target.closest('[data-f]');if(f){flt=f.dataset.f;render()}});
$('#home').onclick=()=>go({v:'home'});
function login(msg){crumb([{t:'เข้าสู่ระบบ'}]);app.innerHTML=`<div class="box" style="max-width:460px;margin:40px auto"><h2>เข้าสู่ระบบ</h2><p class="hint">ใส่อีเมลที่ได้รับสิทธิ์ ระบบจะส่งลิงก์เข้าใช้งานไปที่อีเมล</p><div class="fld"><label>อีเมล</label><input id="em" type="email" autocomplete="email"></div><button class="btn" id="send">ส่งลิงก์เข้าใช้งาน</button>${msg?`<p class="hint" style="color:var(--red)">${esc(msg)}</p>`:''}</div>`;
$('#send').onclick=async()=>{const em=$('#em').value.trim();if(!em)return;$('#send').disabled=true;const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});app.querySelector('.box').insertAdjacentHTML('beforeend',`<p class="hint">${error?'ส่งไม่สำเร็จ: '+esc(error.message):'ส่งลิงก์แล้ว เปิดอีเมลแล้วกดลิงก์เพื่อเข้าใช้งาน'}</p>`);$('#send').disabled=false}}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return login();
app.innerHTML='<p>กำลังโหลดข้อมูล…</p>';
try{const [cs,ms,ls,it]=await Promise.all([get('menu_categories','sort'),get('menus','sort,id'),get('recipe_lines','menu_id,line_no'),get('items','code')]);
if(!ms.length)return login('อีเมลนี้ยังไม่ได้รับสิทธิ์ดูข้อมูล ติดต่อคุณ Don');
const CN=Object.fromEntries(cs.map(c=>[c.id,c.name]));
const all=ms.map(m=>({id:m.id,cat:CN[m.category_id],name:m.is_sub?m.name_th:(m.name_en||m.name_th),th:m.is_sub?null:m.name_th,img:m.image_path,status:m.status==='none'?'fix':m.status,note:m.note,station:m.station,src:m.src,issues:m.issues,is_sub:m.is_sub}));
M=all.filter(m=>!m.is_sub);S=all.filter(m=>m.is_sub);IT=it.map(i=>({...i,c_price:i.consultant_price==null?null:+i.consultant_price,gr_price:i.gr_price==null?null:+i.gr_price,unit_ok:i.gr_unit?i.gr_unit===i.purchase_unit:null,unit:i.purchase_unit}));
const byid=Object.fromEntries(all.map(m=>[m.id,m]));
ls.forEach(x=>{const r={seq:x.line_no,ingredient:x.ingredient||(x.sub_menu_id&&byid[x.sub_menu_id]?.name)||x.item_code,qty:x.qty==null?null:+x.qty,qty_text:x.qty_text,unit:x.unit,sub:x.sub_menu_id};(byid[x.menu_id]?.is_sub?SL:L)[x.menu_id]??=[];(byid[x.menu_id]?.is_sub?SL:L)[x.menu_id].push(r)});
CATS=cs.filter(c=>c.kind!=='sub').map(c=>c.name).filter(n=>M.some(m=>m.cat===n));render()}catch(e){app.innerHTML='<p>โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า</p>'}}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')load()});
load();
}
</script>
</body>
</html>
